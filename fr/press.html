      <!-- One <figure> per quote. For quotes not in French, add a <p class="translation"> (French) under the quote. -->
      <div class="quotes">
        <figure class="quote">
          <blockquote lang="en">“Mira Ceti warm us up, emerging from the dark under a shimmering arch like a mysterious end-of-level boss from a God Of War game. Her powerful voice shines through booming war drums and droning horns.”</blockquote>
          <p class="translation">« Mira Ceti nous met en condition, surgissant de l’obscurité sous une arche scintillante, tel un mystérieux boss de fin de niveau sorti d’un jeu God of War. Sa voix puissante perce à travers les tambours de guerre tonitruants et le bourdonnement des cors. »</p>
          <figcaption><strong>Metal Hammer</strong> · Londres <a href="https://www.loudersound.com/bands-artists/concerts-shows/shes-skipping-spinning-hollering-and-slapping-the-hell-out-of-her-frame-drum-when-shes-not-riling-the-crowd-up-mysterious-viking-war-trance-duo-eihwar-bring-a-party-like-no-other-to-london" target="_blank" rel="noopener">Lire →</a></figcaption>
        </figure>

        <figure class="quote">
          <blockquote lang="en">“Her music unfolded slowly, built on haunting vocals and layered textures that felt almost ceremonial. Bathed in dim, carefully crafted lighting, the duo drew the audience into a suspended, dreamlike state. This wasn’t just a warm-up – it was an initiation.”</blockquote>
          <p class="translation">« Sa musique se déployait lentement, portée par un chant envoûtant et des textures superposées presque cérémonielles. Baigné dans une lumière tamisée, minutieusement travaillée, le duo a plongé le public dans un état suspendu, onirique. Ce n’était pas une simple première partie – c’était une initiation. »</p>
          <figcaption><strong>Reflections of Darkness</strong> · Esch-sur-Alzette <a href="https://www.reflectionsofdarkness.com/artists-a-e/24340-live-review-eihwar-esch-sur-alzette-2026" target="_blank" rel="noopener">Lire →</a></figcaption>
        </figure>

        <figure class="quote">
          <blockquote lang="en">“Mira draws the audience into a mystical journey through distant, untamed lands, made up of vast prairies and the silent waters of the ancient North. The effect is amplified by her ritualistic movements: her slow, solemn dances transform the stage into a suspended realm, where time and space seem to dissolve.”</blockquote>
          <p class="translation">« Mira entraîne le public dans un voyage mystique à travers des terres lointaines et sauvages, faites de vastes prairies et des eaux silencieuses de l’ancien Nord. L’effet est amplifié par ses mouvements rituels : ses danses lentes et solennelles transforment la scène en un royaume suspendu, où le temps et l’espace semblent se dissoudre. »</p>
          <figcaption><strong>Metal Hammer Italy</strong> · Paris <a href="https://www.metalhammer.it/live-report/2026/04/07/eihwar-mira-ceti-machine-du-moulin-rouge-parigi-23-marzo-2026/" target="_blank" rel="noopener">Lire →</a></figcaption>
        </figure>

        <figure class="quote">
          <blockquote lang="en">“Her voice—pure, intense, almost ancestral—seems to traverse the space and strike the listener directly. It is a performance that speaks to the gut even before it speaks to the mind. but the guiding voice of an intimate and deeply powerful experience (…) intense, immersive, that transports the audience far away in time and space.”</blockquote>
          <p class="translation">« Sa voix – pure, intense, presque ancestrale – semble traverser l’espace et frapper directement l’auditeur. C’est une performance qui parle aux tripes avant même de parler à l’esprit. (…) la voix qui guide une expérience intime et profondément puissante (…) intense, immersive, qui transporte le public loin dans le temps et l’espace. »</p>
          <figcaption><strong>Long Live Rock’n’Roll</strong> · Milan <a href="https://www.longliverocknroll.it/eihwar-mira-ceti-santeria-toscana-31-milano-16-04-2026-live-report-recensione-gallery/" target="_blank" rel="noopener">Lire →</a></figcaption>
        </figure>

        <figure class="quote">
          <blockquote lang="en">“In a world of tried-and-true pop and rock clichés, her music, made by different rules, sounds fresh yet unusual.”</blockquote>
          <p class="translation">« Dans un monde de clichés pop et rock éprouvés, sa musique, qui obéit à d’autres règles, sonne à la fois fraîche et singulière. »</p>
          <figcaption><strong>Chaoszine</strong> · Helsinki <a href="https://chaoszine.net/between-ritual-and-fiery-dance-pagan-night-with-eihwar-mira-ceti-live-in-helsinki/" target="_blank" rel="noopener">Lire →</a></figcaption>
        </figure>

        <figure class="quote">
          <blockquote lang="fr">« Face à un public attentif, sa voix perce la pénombre. On se tait, on écoute religieusement. Il y a une gravité et une élégance qui imposent le respect. L’artiste sert ici de vaisseau aux voix des esprits, aux histoires qu’elle nous transmet. »</blockquote>
          <figcaption><strong>Verdammnis</strong> · Paris <a href="https://www.verdammnis.com/reports/eihwar-mira-ceti-la-machine-du-moulin-rouge-paris-75-26-mars-2026-2" target="_blank" rel="noopener">Lire →</a></figcaption>
        </figure>

        <figure class="quote">
          <blockquote lang="fr">« Chaque morceau résonne avec une intensité rare (…), un véritable voyage dans la mémoire des chants et des croyances oubliées, qui n’aura laissé personne indifférent. »</blockquote>
          <figcaption><strong>Metal Rock Magazine</strong> · Paris <a href="https://www.metalrock-magazine.com/live-reports/44248/live-report-eihwar-mira-ceti-26-03-2026-la-machine-du-moulin-rouge-paris/" target="_blank" rel="noopener">Lire →</a></figcaption>
        </figure>

        <figure class="quote">
          <blockquote lang="fr">« Il y a quelque chose de profondément apaisant dans leur musique, mais aussi de mystérieux. On a la sensation d’assister à une forme de rituel, comme si chaque morceau était une incantation. »</blockquote>
          <figcaption><strong>Glob’All Musics</strong> · Mulhouse <a href="https://glob-all-musics.com/eihwar-noumatrouff-mulhouse-17-04-26/" target="_blank" rel="noopener">Lire →</a></figcaption>
        </figure>

        <figure class="quote">
          <blockquote lang="fr">« Sa voix installe immédiatement une atmosphère envoûtante. »</blockquote>
          <figcaption><strong>Rock Hell Mag</strong> <a href="https://rockhellmag.fr/eihwar-live-report/" target="_blank" rel="noopener">Lire →</a></figcaption>
        </figure>
