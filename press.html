        <h1>Press</h1>
        <p>Live reviews from the 2026 European tour with Eihwar.</p>
      </header>

      <!-- One <figure> per quote. For quotes not in English, add a <p class="translation"> under the quote. -->
      <div class="quotes">
        <figure class="quote">
          <blockquote>“Mira Ceti warm us up, emerging from the dark under a shimmering arch like a mysterious end-of-level boss from a God Of War game. Her powerful voice shines through booming war drums and droning horns.”</blockquote>
          <figcaption><strong>Metal Hammer</strong> · London <a href="https://www.loudersound.com/bands-artists/concerts-shows/shes-skipping-spinning-hollering-and-slapping-the-hell-out-of-her-frame-drum-when-shes-not-riling-the-crowd-up-mysterious-viking-war-trance-duo-eihwar-bring-a-party-like-no-other-to-london" target="_blank" rel="noopener">Read →</a></figcaption>
        </figure>

        <figure class="quote">
          <blockquote>“Her music unfolded slowly, built on haunting vocals and layered textures that felt almost ceremonial. Bathed in dim, carefully crafted lighting, the duo drew the audience into a suspended, dreamlike state. This wasn’t just a warm-up – it was an initiation.”</blockquote>
          <figcaption><strong>Reflections of Darkness</strong> · Esch-sur-Alzette <a href="https://www.reflectionsofdarkness.com/artists-a-e/24340-live-review-eihwar-esch-sur-alzette-2026" target="_blank" rel="noopener">Read →</a></figcaption>
        </figure>

        <figure class="quote">
          <blockquote>“Mira draws the audience into a mystical journey through distant, untamed lands, made up of vast prairies and the silent waters of the ancient North. The effect is amplified by her ritualistic movements: her slow, solemn dances transform the stage into a suspended realm, where time and space seem to dissolve.”</blockquote>
          <figcaption><strong>Metal Hammer Italy</strong> · Paris <a href="https://www.metalhammer.it/live-report/2026/04/07/eihwar-mira-ceti-machine-du-moulin-rouge-parigi-23-marzo-2026/" target="_blank" rel="noopener">Read →</a></figcaption>
        </figure>

        <figure class="quote">
          <blockquote>“Her voice—pure, intense, almost ancestral—seems to traverse the space and strike the listener directly. It is a performance that speaks to the gut even before it speaks to the mind. but the guiding voice of an intimate and deeply powerful experience (…) intense, immersive, that transports the audience far away in time and space.”</blockquote>
          <figcaption><strong>Long Live Rock’n’Roll</strong> · Milan <a href="https://www.longliverocknroll.it/eihwar-mira-ceti-santeria-toscana-31-milano-16-04-2026-live-report-recensione-gallery/" target="_blank" rel="noopener">Read →</a></figcaption>
        </figure>

        <figure class="quote">
          <blockquote>“In a world of tried-and-true pop and rock clichés, her music, made by different rules, sounds fresh yet unusual.”</blockquote>
          <figcaption><strong>Chaoszine</strong> · Helsinki <a href="https://chaoszine.net/between-ritual-and-fiery-dance-pagan-night-with-eihwar-mira-ceti-live-in-helsinki/" target="_blank" rel="noopener">Read →</a></figcaption>
        </figure>

        <figure class="quote">
          <blockquote lang="fr">« Face à un public attentif, sa voix perce la pénombre. On se tait, on écoute religieusement. Il y a une gravité et une élégance qui imposent le respect. L’artiste sert ici de vaisseau aux voix des esprits, aux histoires qu’elle nous transmet. »</blockquote>
          <p class="translation">“Before an attentive audience, her voice pierces the darkness. We fall silent and listen religiously. There is a gravity and an elegance that command respect. Here the artist serves as a vessel for the voices of the spirits, for the stories she passes on to us.”</p>
          <figcaption><strong>Verdammnis</strong> · Paris <a href="https://www.verdammnis.com/reports/eihwar-mira-ceti-la-machine-du-moulin-rouge-paris-75-26-mars-2026-2" target="_blank" rel="noopener">Read →</a></figcaption>
        </figure>

        <figure class="quote">
          <blockquote lang="fr">« Chaque morceau résonne avec une intensité rare (…), un véritable voyage dans la mémoire des chants et des croyances oubliées, qui n’aura laissé personne indifférent. »</blockquote>
          <p class="translation">“Each piece resonates with rare intensity (…), a true journey into the memory of forgotten chants and beliefs that left no one indifferent.”</p>
          <figcaption><strong>Metal Rock Magazine</strong> · Paris <a href="https://www.metalrock-magazine.com/live-reports/44248/live-report-eihwar-mira-ceti-26-03-2026-la-machine-du-moulin-rouge-paris/" target="_blank" rel="noopener">Read →</a></figcaption>
        </figure>

        <figure class="quote">
          <blockquote lang="fr">« Il y a quelque chose de profondément apaisant dans leur musique, mais aussi de mystérieux. On a la sensation d’assister à une forme de rituel, comme si chaque morceau était une incantation. »</blockquote>
          <p class="translation">“There is something deeply soothing about their music, but also mysterious. It feels like witnessing a kind of ritual, as if each piece were an incantation.”</p>
          <figcaption><strong>Glob’All Musics</strong> · Mulhouse <a href="https://glob-all-musics.com/eihwar-noumatrouff-mulhouse-17-04-26/" target="_blank" rel="noopener">Read →</a></figcaption>
        </figure>

        <figure class="quote">
          <blockquote lang="fr">« Sa voix installe immédiatement une atmosphère envoûtante. »</blockquote>
          <p class="translation">“Her voice immediately creates a spellbinding atmosphere.”</p>
          <figcaption><strong>Rock Hell Mag</strong> <a href="https://rockhellmag.fr/eihwar-live-report/" target="_blank" rel="noopener">Read →</a></figcaption>
        </figure>
